<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Josh Gilbert • Climate Risk Writer & Podcaster</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;700&display=swap"
    rel="stylesheet"
  >
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: 'Source Sans Pro', sans-serif;
      background: #111;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .profile { max-width: 400px; }
    .avatar {
      width: 150px; height: 150px; border-radius: 50%;
      object-fit: cover; margin-bottom: 1rem;
      border: 4px solid #2d72d9;
    }
    h1 { font-size: 2rem; margin-bottom: 0.25rem; }
    .subtitle {
      font-weight: 400; font-size: 1rem; color: #aaa;
      margin-bottom: 1.5rem;
    }
    .links {
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    .links a {
      display: inline-block; padding: 0.75rem 1.25rem;
      background: #2d72d9; color: white; text-decoration: none;
      font-weight: 600; border-radius: 4px;
      transition: background 0.2s;
    }
    .links a:hover { background: #1b4f9c; }
  </style>
</head>
<body>
  <div class="profile">
    <img src="images/profile.jpg" class="avatar" alt="Josh Gilbert">
    <h1>Josh Gilbert</h1>
    <p class="subtitle">Climate Risk Writer &amp; Podcaster</p>
    <div class="links">
      <a href="https://www.sustglobal.com" target="_blank">Work (Sust Global)</a>
      <a href="https://medium.com/@joshjgilbert" target="_blank">Blog (Medium)</a>
      <a href="https://linkedin.com/in/joshjgilbert" target="_blank">LinkedIn</a>
    </div>
  </div>
</body>
</html>
